<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>A股板块资金走势</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 主题变量：默认深色；body.light 覆盖为浅色（白天自动/手动切换） */
  :root {
    --bg: #0b0e14;
    --card-g: linear-gradient(180deg, #121722, #10141d);
    --t1: #e6e9f0; --t1b: #c6ccd8; --t2: #8b93a7; --t3: #6b7386; --t4: #586074;
    --line: #1c2536; --panel: rgba(255,255,255,.03); --sep: rgba(255,255,255,.08);
    --pop: rgba(18,23,34,.97); --shadow: 0 10px 36px rgba(0,0,0,.4);
    --tabon: #ffd2d2; --link: #4d9dff;
    --skel1: rgba(255,255,255,.04); --skel2: rgba(255,255,255,.09);
  }
  body.light {
    --bg: #eef1f6;
    --card-g: linear-gradient(180deg, #ffffff, #f6f8fb);
    --t1: #1f2937; --t1b: #3a4560; --t2: #5b6577; --t3: #7a8499; --t4: #98a1b3;
    --line: #d7deea; --panel: rgba(15,35,70,.05); --sep: rgba(15,35,70,.10);
    --pop: rgba(255,255,255,.98); --shadow: 0 8px 24px rgba(30,50,80,.14);
    --tabon: #c0303c; --link: #1a6ee0;
    --skel1: rgba(15,35,70,.05); --skel2: rgba(15,35,70,.12);
  }
  html, body { background: var(--bg); }
  body {
    color: var(--t1);
    font-family: system-ui, -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding: 14px 12px 28px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  .card {
    background: var(--card-g);
    border: 1px solid var(--sep);
    border-radius: 16px; padding: 14px 12px 10px;
    box-shadow: var(--shadow);
  }
  .head { display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
  .clock { margin-left: auto; font-size: 13px; color: var(--t2); font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4d4f; flex: none;
    animation: pulse 1.2s ease-in-out infinite; }
  .dot.idle { background: var(--t4); animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,77,79,.55); }
    50% { opacity: .5; box-shadow: 0 0 0 6px rgba(255,77,79,0); }
  }
  .pill { font-size: 11px; line-height: 1; padding: 4px 9px; border-radius: 999px; border: 1px solid; flex: none; }
  .pill.live { color: #ff7a7a; border-color: rgba(255,77,79,.45); background: rgba(255,77,79,.1); }
  .pill.lunch { color: #f0b34e; border-color: rgba(240,179,78,.4); background: rgba(240,179,78,.08); }
  .pill.off { color: var(--t3); border-color: rgba(125,133,152,.35); background: rgba(125,133,152,.08); }
  /* 数据源切换按钮排 */
  .tabs { display: flex; align-items: center; gap: 7px; margin: 11px 0 2px; flex-wrap: wrap; }
  .tab {
    font-size: 12px; line-height: 1; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--sep); background: var(--panel);
    color: var(--t2); cursor: pointer; transition: all .18s ease; font-family: inherit;
  }
  .tab:active { transform: scale(.96); }
  .tab.on { color: var(--tabon); border-color: rgba(255,77,79,.55); background: rgba(255,77,79,.14);
    box-shadow: 0 0 12px rgba(255,77,79,.18); }
  .tab-src { font-size: 11px; color: var(--t3); }
  /* 曲线模式 + 时间范围切换 */
  .tabs2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
  .tlabel { font-size: 10px; color: var(--t3); flex: none; }
  .tab.sm { font-size: 11px; padding: 5px 10px; }
  .sub { font-size: 12px; color: var(--t2); margin: 7px 0 4px; }
  canvas { width: 100%; height: 290px; display: block; touch-action: pan-y; }
  .foot { display: flex; align-items: center; gap: 14px; margin-top: 6px; font-size: 11px; color: var(--t3);
    border-top: 1px solid var(--sep); padding-top: 8px; }
  .snap-btn { font-size: 11px; color: var(--link); background: none; border: 1px solid rgba(77,157,255,.35);
    border-radius: 999px; padding: 4px 12px; cursor: pointer; font-family: inherit; transition: all .18s ease; }
  .snap-btn:hover { background: rgba(77,157,255,.12); }
  .lg { display: inline-flex; align-items: center; gap: 5px; }
  .lg i { width: 12px; height: 3px; border-radius: 2px; }
  #upd { margin-left: auto; font-variant-numeric: tabular-nums; }
  @media (max-width: 420px) { .sub { font-size: 11px; } h1 { font-size: 14px; } .tab { font-size: 11px; padding: 6px 11px; } }

  /* ===== 板块资金排行卡片 ===== */
  .rank-card { margin-top: 12px; padding-bottom: 6px; }
  .rank-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rk-title { font-size: 14px; font-weight: 700; }
  .rtabs { margin-left: auto; display: flex; gap: 6px; }
  .rtab { font-size: 11px; line-height: 1; padding: 6px 11px; border-radius: 999px;
    border: 1px solid var(--sep); background: var(--panel);
    color: var(--t2); cursor: pointer; font-family: inherit; transition: all .18s ease; }
  .rtab.on { color: var(--tabon); border-color: rgba(255,77,79,.55); background: rgba(255,77,79,.14); }
  .rank-scroll { max-height: 430px; overflow-y: auto; margin-top: 8px; -webkit-overflow-scrolling: touch; }
  .rrow { display: flex; align-items: center; gap: 8px; padding: 9px 4px;
    border-bottom: 1px solid var(--sep); cursor: pointer; }
  .rrow:active { background: var(--sep); }
  .rk { width: 22px; text-align: center; font-size: 11px; color: var(--t3);
    font-variant-numeric: tabular-nums; flex: none; }
  .rk.top3 { color: #f0b34e; font-weight: 700; }
  .rgrow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
  .rdot { width: 7px; height: 7px; border-radius: 50%; flex: none; box-shadow: 0 0 5px currentColor; }
  .rname { font-size: 13px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rpct, .rval { font-size: 12px; font-variant-numeric: tabular-nums; flex: none; text-align: right; }
  .rpct { width: 62px; }
  .rval { width: 78px; font-weight: 600; }
  .up { color: #ff5c5c; } .down { color: #00c48c; } .flat { color: var(--t2); }
  .chev { flex: none; color: var(--t4); font-size: 10px; transition: transform .2s; }
  .rrow.exp .chev { transform: rotate(90deg); }
  .stocks { background: var(--panel); border-radius: 10px; margin: 2px 0 8px; padding: 6px 8px; }
  .st-title { font-size: 11px; color: var(--t2); padding: 4px 2px 6px; }
  .srow { display: flex; align-items: center; gap: 10px; padding: 7px 2px;
    border-top: 1px solid var(--sep); }
  .srow:first-of-type { border-top: none; }
  .spark { width: 56px; height: 24px; flex: none; }
  .sinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .sname { font-size: 12.5px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scode { font-size: 10px; color: var(--t4); }
  .spct { font-size: 12px; width: 58px; text-align: right; flex: none; font-variant-numeric: tabular-nums; }
  .sval { font-size: 12px; width: 74px; text-align: right; font-weight: 600; flex: none; font-variant-numeric: tabular-nums; }
  .loading { font-size: 12px; color: var(--t3); padding: 10px 2px; text-align: center; }
  @media (max-width: 420px) {
    .rpct { width: 54px; } .rval { width: 70px; font-size: 11.5px; }
    .spark { width: 48px; } .spct { width: 52px; } .sval { width: 66px; }
  }

  /* ===== 走势板块细分模块 ===== */
  .bd-card { margin-top: 12px; padding-bottom: 12px; }
  .bd-title { font-size: 15px; font-weight: 700; }
  .bd-desc { font-size: 12px; color: var(--t2); margin-top: 3px; }
  .bd-note { font-size: 11px; color: var(--t3); margin: 6px 0 10px; }
  .bd-dual { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bd-dcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; position: relative; min-height: 78px; }
  .bd-drow { display: flex; align-items: center; gap: 6px; }
  .bd-ddot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 6px currentColor; }
  .bd-dname { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bd-dval { font-size: 17px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .bd-dtag { font-size: 10px; color: var(--t3); margin-top: 2px; }
  .bd-sec { margin-top: 14px; }
  .bd-sec-head { display: flex; align-items: center; gap: 8px; }
  .bd-sec-title { font-size: 13px; font-weight: 700; }
  .bd-sec-hint { font-size: 10px; color: var(--t3); margin-left: auto; }
  .bd-acc { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 0 12px; margin-top: 8px; }
  .bd-acc-col { min-width: 0; }
  .bd-acc-sep { border-left: 1px dashed var(--sep); }
  .bd-acc-col-t { font-size: 11px; color: var(--t2); padding-bottom: 4px; }
  .bd-acc-item { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    padding: 7px 0; border-bottom: 1px dashed var(--sep); font-size: 12px; }
  .bd-acc-item:last-child { border-bottom: none; }
  .bd-acc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t1b); }
  .bd-acc-val { font-variant-numeric: tabular-nums; font-weight: 600; flex: none; }
  .bd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .bd-mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; }
  .bd-mrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .bd-mname { font-size: 12px; color: var(--t1b); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bd-mval { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
  .bd-spark { width: 100%; height: 64px; display: block; margin-top: 6px; }
  .bd-expand { font-size: 11px; color: var(--link); background: none; border: 1px solid rgba(77,157,255,.35);
    border-radius: 999px; padding: 4px 12px; cursor: pointer; font-family: inherit; margin-left: auto; }
  .bd-count { font-size: 10px; color: var(--t3); }
  .bd-empty { font-size: 12px; color: var(--t2); padding: 16px 0; text-align: center; }
  .bd-skel { border-radius: 12px; background: linear-gradient(90deg, var(--skel1) 25%,
    var(--skel2) 50%, var(--skel1) 75%); background-size: 200% 100%;
    animation: bdshine 1.2s infinite; }
  @keyframes bdshine { to { background-position: -200% 0; } }

  /* ===== 自选概念管理 + 细分个股下钻 ===== */
  .cust-search { display: flex; gap: 8px; margin: 8px 0 2px; }
  .cust-input { flex: 1; min-width: 0; background: var(--sep); border: 1px solid var(--sep);
    border-radius: 8px; color: var(--t1); font-size: 13px; padding: 8px 10px; font-family: inherit; outline: none; }
  .cust-input:focus { border-color: rgba(77,157,255,.55); }
  .cust-add { font-size: 12px; color: var(--link); background: rgba(77,157,255,.1); border: 1px solid rgba(77,157,255,.4);
    border-radius: 8px; padding: 0 14px; cursor: pointer; font-family: inherit; flex: none; }
  .cust-sug { max-height: 180px; overflow-y: auto; margin-top: 4px; border-radius: 8px;
    background: var(--pop); border: 1px solid var(--sep); display: none; }
  .cust-sug.on { display: block; }
  .cust-sug-item { display: flex; justify-content: space-between; padding: 8px 10px; font-size: 12.5px;
    cursor: pointer; color: var(--t1b); }
  .cust-sug-item:active { background: rgba(77,157,255,.12); }
  .cust-sug-item.has { color: var(--t3); cursor: default; }
  .cust-del { font-size: 12px; color: #ff7a7a; background: none; border: none; cursor: pointer;
    font-family: inherit; padding: 4px 6px; flex: none; }
  .rrow .cust-del { visibility: hidden; }
  .rrow:hover .cust-del { visibility: visible; }
  /* 细分个股区 */
  .bd-stocks { margin-top: 8px; border-top: 1px dashed var(--sep); padding-top: 6px; }
  .bd-st-sort { display: flex; gap: 5px; margin-bottom: 4px; }
  .bd-st-tab { font-size: 10px; line-height: 1; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--sep); background: none; color: var(--t2); cursor: pointer; font-family: inherit; }
  .bd-st-tab.on { color: var(--tabon); border-color: rgba(255,77,79,.55); background: rgba(255,77,79,.14); }
  .bd-st-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px;
    border-top: 1px solid var(--sep); }
  .bd-st-row:first-of-type { border-top: none; }
  .bd-st-name { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bd-st-nm { font-size: 12px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bd-st-cd { font-size: 9.5px; color: var(--t4); }
  .bd-st-sp { width: 52px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  .bd-st-pc { width: 52px; text-align: right; font-variant-numeric: tabular-nums; flex: none; }
  .bd-st-vl { width: 62px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
  .bd-st-hint { font-size: 9.5px; color: var(--t4); display: flex; justify-content: space-between; margin-bottom: 2px; }
  .bd-mcard { cursor: pointer; }

  /* ===== 全市场ETF资金净额模块 ===== */
  .etf-card { margin-top: 12px; padding-bottom: 12px; }
  .etf-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .etf-title { font-size: 15px; font-weight: 700; }
  .etf-badge { font-size: 10px; line-height: 1; padding: 4px 8px; border-radius: 999px; flex: none; }
  .etf-badge.ok { color: var(--link); border: 1px solid rgba(77,157,255,.4); background: rgba(77,157,255,.08); }
  .etf-badge.miss { color: #f0b34e; border: 1px solid rgba(240,179,78,.4); background: rgba(240,179,78,.08); }
  .etf-date { font-size: 10px; color: var(--t3); flex: none; font-variant-numeric: tabular-nums; }
  .etf-refresh { margin-left: auto; font-size: 11px; color: var(--link); background: none;
    border: 1px solid rgba(77,157,255,.35); border-radius: 999px; padding: 4px 12px;
    cursor: pointer; font-family: inherit; flex: none; }
  .etf-desc { font-size: 12px; color: var(--t2); margin-top: 3px; }
  .etf-tabs { display: flex; gap: 6px; margin: 10px 0 4px; }
  .etf-tab { font-size: 11px; line-height: 1; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--sep); background: var(--panel);
    color: var(--t2); cursor: pointer; font-family: inherit; transition: all .18s ease; }
  .etf-tab.on { color: var(--tabon); border-color: rgba(255,77,79,.55); background: rgba(255,77,79,.14); }
  .etf-sec-h { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .etf-sec-t { font-size: 13px; font-weight: 700; }
  .etf-sec-note { font-size: 10px; color: var(--t3); margin-left: auto; font-variant-numeric: tabular-nums; }
  .etf-sub { font-size: 11px; color: var(--t3); margin: 2px 0 6px; }
  .etf-mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  @media (min-width: 560px) { .etf-mgrid { grid-template-columns: repeat(3, 1fr); } }
  .etf-mcell { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 86px; }
  .etf-mname { font-size: 11px; color: var(--t2); }
  .etf-mval { font-size: 19px; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .etf-mval .u { font-size: 12px; font-weight: 400; color: var(--t2); }
  .etf-mnote { font-size: 10px; color: var(--t3); margin-top: 3px; }
  .etf-anc { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
  .etf-anc-l { flex: 1; min-width: 0; }
  .etf-anc-tag { font-size: 10px; color: var(--t3); }
  .etf-anc-name { font-size: 14px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .etf-anc-code { font-size: 10px; color: var(--t4); font-variant-numeric: tabular-nums; }
  .etf-anc-r { text-align: right; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .etf-anc-val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .etf-anc-lock { font-size: 10px; color: var(--t2); font-variant-numeric: tabular-nums; }
  .etf-anc-btns { display: flex; gap: 6px; }
  .etf-btn { font-size: 10.5px; line-height: 1; padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--sep); background: none; color: var(--t2);
    cursor: pointer; font-family: inherit; flex: none; }
  .etf-btn.on { color: var(--tabon); border-color: rgba(255,77,79,.5); background: rgba(255,77,79,.12); }
  .etf-row { display: flex; align-items: center; gap: 8px; padding: 8px 4px;
    border-bottom: 1px solid var(--sep); }
  .etf-name { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .etf-name b { font-size: 12.5px; color: var(--t1); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .etf-name b.stale { color: var(--t4); }
  .etf-name i { font-size: 10px; color: var(--t4); font-style: normal; font-variant-numeric: tabular-nums; }
  .etf-val { width: 84px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; flex: none; font-size: 12px; }
  .etf-d5 { width: 74px; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; flex: none; color: var(--t2); }
  .etf-list { max-height: 420px; overflow-y: auto; margin-top: 6px; -webkit-overflow-scrolling: touch; }
  .etf-empty { font-size: 12px; color: var(--t2); text-align: center; padding: 18px 0; }
  .etf-cv { width: 100%; height: 240px; display: block; margin-top: 8px; }
  .etf-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .etf-chip { font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--sep);
    color: var(--t1b); display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
  .etf-chip .x { color: #ff7a7a; cursor: pointer; }
  .etf-seg { display: flex; gap: 6px; }
  .etf-search { flex: 1; min-width: 120px; background: var(--sep); border: 1px solid var(--sep);
    border-radius: 8px; color: var(--t1); font-size: 12px; padding: 6px 10px; font-family: inherit; outline: none; }
  .etf-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--pop); border: 1px solid var(--sep); color: var(--t1);
    font-size: 12px; padding: 8px 16px; border-radius: 999px; opacity: 0; transition: all .25s;
    z-index: 99; pointer-events: none; }
  .etf-toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <span class="dot idle" id="dot"></span>
      <h1>A股板块资金走势</h1>
      <span class="pill off" id="pill">加载中</span>
      <span class="clock" id="clock">--:--:--</span>
      <button class="snap-btn" id="themeBtn" title="主题：自动（白天浅色/夜间深色），点击切换">⏱</button>
    </div>
    <div class="tabs">
      <button class="tab" id="tab-hy" onclick="switchSource('hy')">东财·行业</button>
      <button class="tab" id="tab-gn" onclick="switchSource('gn')">东财·概念</button>
      <button class="tab" id="tab-custom" onclick="switchSource('custom')">自选概念</button>
      <span class="tab-src" style="color:var(--t3)">数据源：东方财富</span>
    </div>
    <div class="tabs2">
      <span class="tlabel">曲线</span>
      <button class="tab sm on" id="md-cum" onclick="setMode('cum')">累计净额</button>
      <button class="tab sm" id="md-vel" onclick="setMode('vel')">5分流速</button>
      <span class="tlabel" style="margin-left:4px">范围</span>
      <button class="tab sm on" id="wd-0" onclick="setWin(0)">全天</button>

/* ================= JSONP（3 秒超时，失败重试 1 次） ================= */
let seq = 0;
function jsonp(url, timeout = 3000) {
  return new Promise((resolve, reject) => {
    const cb = '__emcb' + (++seq);
    const s = document.createElement('script');
    let settled = false;
    const timer = setTimeout(() => finish(new Error('timeout')), timeout);
    function finish(err, data) {
      if (settled) return;
      settled = true; clearTimeout(timer);
      delete window[cb]; s.remove();
      err ? reject(err) : resolve(data);
    }
    window[cb] = d => finish(null, d);
    s.src = url + (url.includes('?') ? '&' : '?') + 'cb=' + cb;
    s.onerror = () => finish(new Error('network'));
    document.head.appendChild(s);
  });
}
async function jsonpRetry(url, tries = 3) {
  let lastErr, cur = url;
  for (let i = 0; i < tries; i++) {
    if (i) await new Promise(r => setTimeout(r, 700 * i)); // 退避：等故障突发窗口过去再重试
    try { return await jsonp(cur, 4000); }
    catch (e) {
      lastErr = e;
      // 域名容灾：push2 被限流/不可达时切东财官方延时镜像 push2delay（收盘后数据一致，盘中可能略滞后）
      cur = cur.replace('push2.eastmoney.com', 'push2delay.eastmoney.com');
    }
  }
  throw lastErr;
}

/* ================= 时间工具 ================= */
// "09:31"→1  "11:30"→120  "13:00"→120  "13:01"→121  "15:00"→240（跳过午休）
function timeToMinute(hhmm) {
  const c = hhmm.split(':');
  const t = (+c[0]) * 60 + (+c[1]);
  if (t <= 690) return t - 570;   // 上午
  if (t >= 780) return t - 660;   // 下午
  return -1;                      // 午休时段不应出现
}
const hhmmss = d => [d.getHours(), d.getMinutes(), d.getSeconds()]
  .map(x => String(x).padStart(2, '0')).join(':');

// klines 行数组 → [{m:交易分钟, v:亿}]（板块/个股分时共用解析）
function parsePts(klines) {
  const pts = [];
  for (const line of klines || []) {
    const ci = line.lastIndexOf(',');
    if (ci < 8) continue;
    const v = parseFloat(line.slice(ci + 1));
    if (!isFinite(v)) continue;
    const m = timeToMinute(line.slice(ci - 5, ci));
    if (m >= 0 && m <= TOTAL_MIN) pts.push({ m, v: v / 1e8 });
  }
  return pts;
}

  if (t < 570)  return 'auction';  // 09:15-09:30
  if (t < 690)  return 'trading';  // 09:30-11:30
  if (t < 780)  return 'lunch';    // 11:30-13:00
  if (t < 900)  return 'trading';  // 13:00-15:00
  return 'closed';
}

function rollingVel(pts) {
  const out = [];
  const buf = [];
  for (let i = 0; i < pts.length; i++) {
    buf.push(i ? pts[i].v - pts[i - 1].v : pts[i].v);
    if (buf.length > 5) buf.shift();
    let s = 0;
    for (const x of buf) s += x;
    out.push({ m: pts[i].m, v: s });
  }
  return out;
}

  return { mLo: Math.max(0, mHi - state.win), mHi };
}

    points: [],        // [{m:交易分钟, v:亿}] 累计净额
    vel: [],           // [{m, v:亿}] 5 分钟滚动流速（由 points 派生）
    anim: null,        // {from,to,start,dur} 生长动画
    flashStart: 0, flashDir: 0, flashPending: null,
  };
}

async function fetchCycle(force) {
  if (SNAP) return; // 离线快照：不发任何请求
  if (fetching && !force) return;
  const myGen = ++fetchGen;   // 代际计数：切换数据源会开新代，旧请求的所有写入作废
  const mySrc = state.source;
  fetching = true;
  try {
    failStreak = 0; // 请求成功重置退避
    /* --- 自选概念模式：ulist 拉板块净额 → 构造/复用 sectors → 排行榜 = 自选列表 --- */
    if (mySrc === 'custom') {
      const bks = loadCustom();
      if (!bks.length) {
        state.sectors = []; state.rankIn = []; state.rankOut = [];
        renderRank(); state.everFetched = true;
        updEl.textContent = '自选为空，请在下方搜索添加概念';
        return;
      }
      const r = await jsonpRetry(ulistUrl(bks.map(b => '90.' + b).join(',')));
      if (fetchGen !== myGen) return;
      const diff = arr(r && r.data && r.data.diff).filter(d => d && d.f12);
      const byBk = new Map(diff.map(d => [d.f12, d]));
      const old = new Map(state.sectors.map(s => [s.bk, s]));
      state.sectors = bks.filter(bk => byBk.has(bk)).map((bk, i) => {
        const oldSec = old.get(bk);
        if (oldSec) return oldSec; // 复用：保留曲线与动画状态，不重播
        const d = byBk.get(bk);
        return mkSector(d, d.f62 >= 0 ? 1 : -1, i); // 首次按净额方向配色（红涨绿跌）
      });
      const custRows = bks.map(bk => byBk.get(bk)).filter(Boolean);
      state.rankIn = [...custRows].sort((x, y) => (y.f62 || 0) - (x.f62 || 0)); // 自选列表统一按净额降序
      state.rankOut = state.rankIn;
      state.everFetched = true; state.locked = true;
      renderRank();
      if (!state.selected && state.sectors.length) {
        state.selected = state.sectors[0].bk;
        loadBreakdown(state.selected);
      }
      await Promise.all(state.sectors.map(s => fetchKline(s, myGen)));
      if (fetchGen !== myGen) return;
      renderRank();
      try { renderDual(); if (cycleCount % 2 === 0) refreshSubKlines(); } catch (e) {}
      cycleCount++;
      updEl.textContent = '更新 ' + hhmmss(new Date());
      return;
    }
    const fs = SOURCES[mySrc].fs;
    // ① po=1 / po=0 并行拉排行（只拉一次会全是净流入，净流出凑不齐）
    const [a, b] = await Promise.all([jsonpRetry(rankUrl(fs, 1)), jsonpRetry(rankUrl(fs, 0))]);
    if (fetchGen !== myGen) return;
    const inflow = arr(a && a.data && a.data.diff);
    const outflow = arr(b && b.data && b.data.diff);
    if (a && a.data && a.data.total && !state.total) { state.total = a.data.total; updateSub(); }
    state.rankIn = inflow; state.rankOut = outflow;
    renderRank();
    // 板块集合保持固定：仅首次选定（双向各取前 5），之后只更新数值
    if (!state.locked && inflow.length + outflow.length > 0) {
      const seen = new Set();
      state.sectors = [];
      inflow.slice(0, 5).forEach((d, i)  => { if (d && d.f12 && !seen.has(d.f12)) { seen.add(d.f12); state.sectors.push(mkSector(d, 1, i)); } });
      outflow.slice(0, 5).forEach((d, i) => { if (d && d.f12 && !seen.has(d.f12)) { seen.add(d.f12); state.sectors.push(mkSector(d, -1, i)); } });
      state.locked = true;
      if (!state.selected && state.sectors.length) { // 默认选中净流入 TOP1 → 驱动细分模块
        state.selected = state.sectors[0].bk;
        loadBreakdown(state.selected);
      }
    }
    state.everFetched = true;
    // ② 10 个板块并发拉分时（单板块失败保留旧曲线）
    await Promise.all(state.sectors.map(s => fetchKline(s, myGen)));
    if (fetchGen !== myGen) return;
    renderRank(); // 曲线板块确定后再渲染一次（排行榜中的曲线标记点）
    // 细分模块跟随刷新：双卡数值每轮、批量净额每轮、细分分时每 2 轮（模块级隔离，失败不影响主图）
    try {
      renderDual();
      refreshSubValues();
      if (cycleCount % 2 === 0) refreshSubKlines();
    } catch (e) { /* 细分模块异常不阻塞主图 */ }
    // 展开中的板块：每 2 轮刷新一次个股数据（约 20 秒）
    cycleCount++;
    const curList = state.rankTab === 'in' ? state.rankIn : state.rankOut;
    if (state.expanded && cycleCount % 2 === 0 &&
        curList.some(d => d.f12 === state.expanded.bk)) refreshExpanded();
    updEl.textContent = '更新 ' + hhmmss(new Date());
  } catch (e) {
    failStreak++;
    if (!state.everFetched && fetchGen === myGen)
      updEl.textContent = failStreak >= 3 ? '获取失败，限流退避中（30 秒间隔）…' : '获取失败，10 秒后重试…';
  } finally {
    if (fetchGen === myGen) fetching = false; // 只有最新代负责复位，永不死锁
  }
}

async function fetchKline(sec, myGen) {
  let res;
  try { res = await jsonpRetry(klineUrl(sec.bk)); }
  catch (e) { return; } // 失败：保留旧曲线，不中断整体
  if (fetchGen !== myGen) return;
  const pts = parsePts(res && res.data && res.data.klines);
  if (!pts.length) return;
  const now = performance.now();
  const fromCount = drawnCount(sec, now);   // 从当前画面位置继续生长
  const oldLen = sec.points.length;
  const prevLast = oldLen ? sec.points[oldLen - 1].v : null;
  sec.points = pts;
  sec.vel = rollingVel(pts);
  if (pts.length > oldLen) {                // 有新点 → 触发生长动画
    sec.anim = { from: fromCount, to: pts.length, start: now,
                 dur: fromCount <= 0.001 ? 1300 : 800 };
  }
  const newLast = pts[pts.length - 1].v;    // 当前值变化 → 数值闪烁
  if (prevLast !== null && Math.abs(newLast - prevLast) > 1e-9) {
    const dir = newLast > prevLast ? 1 : -1;
    if (sec.anim) sec.flashPending = dir;   // 动画结束后再闪（标签此时才出现）
    else { sec.flashStart = now; sec.flashDir = dir; }
  }
}

/* ================= 动画：easeOutCubic 生长 ================= */
function drawnCount(sec, now) {
  const a = sec.anim;
  if (!a) return sec.points.length;
  const t = (now - a.start) / a.dur;
  if (t >= 1) {
    if (sec.flashPending) { sec.flashStart = now; sec.flashDir = sec.flashPending; sec.flashPending = null; }
    sec.anim = null;
    return sec.points.length;
  }
  const e = 1 - Math.pow(1 - t, 3);
  return a.from + (a.to - a.from) * e;
}

/* ================= 绘制 ================= */
function geo() {
  const W = CV.clientWidth, H = CV.clientHeight;
  const plotL = 40, plotR = W - 10, plotT = 12, plotB = H - 22;
  return { W, H, plotL, plotR, plotT, plotB, plotW: plotR - plotL, plotH: plotB - plotT,
           zeroY: plotT + (plotB - plotT) * 0.35 };
}
function Y(v, g, sc) { // 双段刻度：正区上 35%、负区下 65%，0 轴分界
  const y = v >= 0
    ? g.zeroY - (v / sc.vMax) * (g.plotH * 0.35)
    : g.zeroY + (-v / -sc.vMin) * (g.plotH * 0.65);
  return Math.max(g.plotT, Math.min(g.plotB, y)); // 极端值 clamp
}
function niceStep(x) {
  const e = Math.pow(10, Math.floor(Math.log10(x)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= x - 1e-12) return m * e;
  return 10 * e;
}
const fmtTick = v => v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
const fmtVal = v => (v >= 0 ? '+' : '-') + fmtTick(Math.abs(v)) + '亿';
function fillRoundRect(x, y, w, h, r, color) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  ctx.fillStyle = color; ctx.fill();
}

function drawChart() {
  const g = geo(), now = performance.now();
  const dom = calcDomain();
  const span = dom.mHi - dom.mLo || 1;
  const xOf = m => g.plotL + ((m - dom.mLo) / span) * g.plotW;

  /* --- Y 刻度：只按可见范围的数据计算（窗口模式下自动放大细节） --- */
  let vMax = 0.1, vMin = -0.1;
  for (const s of state.sectors) for (const p of seriesOf(s)) {
    if (p.m < dom.mLo) continue;
    if (p.v > vMax) vMax = p.v;
    if (p.v < vMin) vMin = p.v;
  }
  const sc = { vMax, vMin };
  ctx.clearRect(0, 0, g.W, g.H);

  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const hLine = (v, strong) => {
    const y = Y(v, g, sc);
    ctx.strokeStyle = strong ? UI.axisStrong : UI.gridW;
    ctx.lineWidth = strong ? 1.5 : 1;
    ctx.beginPath(); ctx.moveTo(g.plotL, y); ctx.lineTo(g.plotR, y); ctx.stroke();
    ctx.fillStyle = strong ? UI.axisTxt : UI.txtDim;
    ctx.fillText((v > 0 ? '+' : '') + fmtTick(v), g.plotL - 6, y);
  };
  const ps = niceStep(sc.vMax / 2);
  for (let i = 1; i * ps <= sc.vMax * 1.0001; i++) hLine(i * ps, false);
  const ns = niceStep(-sc.vMin / 3);
  for (let i = 1; i * ns <= -sc.vMin * 1.0001; i++) hLine(-i * ns, false);
  hLine(0, true); // 0 轴加粗

  /* --- X 轴：自适应时间网格（全天每30分 / 60分窗每10分 / 30·15分窗每5分 / 5分窗每1分） --- */
  const step = !state.win ? 30 : state.win >= 60 ? 10 : state.win >= 15 ? 5 : 1;
  const ticks = [];
  for (let m = Math.ceil((dom.mLo - 1e-9) / step) * step; m <= dom.mHi + 1e-9; m += step) ticks.push(m);
  ctx.strokeStyle = UI.gridV; ctx.lineWidth = 1;
  for (const m of ticks) { // 垂直网格线（边缘两条由坐标框代替，不画）
    if (m === dom.mLo || m === dom.mHi) continue;
    const x = xOf(m);
    ctx.beginPath(); ctx.moveTo(x, g.plotT); ctx.lineTo(x, g.plotB); ctx.stroke();
  }
  /* --- 午休分隔虚线（仅当 11:30/13:00 压缩点落在可见域内） --- */
  if (120 >= dom.mLo && 120 <= dom.mHi) {
    const xm = xOf(120);
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = UI.lunch; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(xm, g.plotT); ctx.lineTo(xm, g.plotB); ctx.stroke();
    ctx.restore();
  }

  ctx.fillStyle = UI.txtDim;
  ctx.textBaseline = 'top';
  const yb = g.plotB + 6;
  for (const m of ticks) {
    if (!state.win && m === 120) continue; // 全天视图：午休点由虚线表达，不标文字
    const lbl = state.win && m === 120 ? '11:30/13:00' : mToClock(m);
    const x = xOf(m);
    ctx.font = (lbl.length > 5 ? '9px' : '10px') + ' system-ui, sans-serif';
    let align = 'center', tx = x; // 首尾刻度防截断
    if (x < g.plotL + 14) { align = 'left'; tx = g.plotL; }
    else if (x > g.plotR - 14) { align = 'right'; tx = g.plotR; }
    ctx.textAlign = align;
    ctx.fillText(lbl, tx, yb);
  }

  /* --- 曲线（选中态：选中加粗高亮后画，其余淡化；生长动画 easeOutCubic） --- */
  const selBk = state.selected;
  hitTargets = { labels: [], curves: [] };
  const labels = [];
  const drawSeries = (s, dim) => {
    const ser = seriesOf(s);
    if (!ser.length) return;
    const k = drawnCount(s, now); // 调用后 s.anim===null 表示动画已完成
    const n = Math.min(Math.floor(k), ser.length);
    const frac = k - Math.floor(k);
    ctx.save();
    ctx.globalAlpha = dim ? 0.28 : 1;
    ctx.strokeStyle = s.color; ctx.lineWidth = dim ? 1.4 : 2.6;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      const p = ser[i];
      if (p.m < dom.mLo) continue; // 只画可见域
      const x = xOf(p.m), y = Y(p.v, g, sc);
      started ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), started = true);
    }
    if (frac > 0 && n < ser.length) { // 末段插值，平滑生长
      const p1 = ser[n];
      const x1 = xOf(p1.m), y1 = Y(p1.v, g, sc);
      if (n === 0) { // 第一个点：从左边缘长出
        ctx.moveTo(g.plotL, y1);
        ctx.lineTo(g.plotL + (x1 - g.plotL) * frac, y1);
      } else {
        const p0 = ser[n - 1];
        const x0 = xOf(p0.m), y0 = Y(p0.v, g, sc);
        ctx.lineTo(x0 + (x1 - x0) * frac, y0 + (y1 - y0) * frac);
      }
    }
    ctx.stroke();
    ctx.restore();
    // 命中区：整条序列的屏幕坐标（与动画进度无关，供点击选中）
    const hpts = [];
    for (const p of ser) if (p.m >= dom.mLo) { hpts.push(xOf(p.m)); hpts.push(Y(p.v, g, sc)); }
    hitTargets.curves.push({ bk: s.bk, pts: hpts });
    if (!s.anim) { // 端点与标签仅在生长完成后显示
      const p = ser[ser.length - 1];
      labels.push({ s, ex: xOf(p.m), ey: Y(p.v, g, sc), lastV: p.v, dim });
    }
  };
  for (const s of state.sectors) if (s.bk !== selBk) drawSeries(s, true);
  for (const s of state.sectors) if (s.bk === selBk) drawSeries(s, false);

  /* --- 端点标签：按 Y 排序后推开防重叠 --- */
  ctx.font = '11px system-ui, sans-serif';
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  if (labels.length) {
    labels.sort((a, b) => a.ey - b.ey);
    const gap = 15;
    labels.forEach(L => L.ly = L.ey);
    for (let i = 1; i < labels.length; i++)
      if (labels[i].ly < labels[i - 1].ly + gap) labels[i].ly = labels[i - 1].ly + gap;
    const maxLy = g.plotB - 2;
    if (labels[labels.length - 1].ly > maxLy) {
      labels[labels.length - 1].ly = maxLy;
      for (let i = labels.length - 2; i >= 0; i--)
        if (labels[i].ly > labels[i + 1].ly - gap) labels[i].ly = labels[i + 1].ly - gap;
    }
    for (const L of labels) {
      const text = L.s.name + ' ' + fmtVal(L.lastV);
      const tw = ctx.measureText(text).width;
      const tx = Math.min(L.ex + 8, g.W - tw - 4);
      ctx.save();
      ctx.globalAlpha = L.dim ? 0.45 : 1; // 选中标签全亮，其余淡化
      if (Math.abs(L.ly - L.ey) > 6) { // 标签被推离端点：画细引导线，标明归属（流速模式标签聚在0轴附近时关键）
        ctx.strokeStyle = L.s.color;
        ctx.globalAlpha *= 0.5;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(L.ex + 3, L.ey);
        ctx.lineTo(tx - 2, L.ly);
        ctx.stroke();
        ctx.globalAlpha = L.dim ? 0.45 : 1;
      }
      ctx.fillStyle = L.s.color; // 端点小圆点（选中加大）
      ctx.beginPath(); ctx.arc(L.ex, L.ey, L.dim ? 2.6 : 3.4, 0, Math.PI * 2); ctx.fill();
      fillRoundRect(tx - 3, L.ly - 8, tw + 6, 16, 4, UI.labelBg); // 底衬
      const el = now - L.s.flashStart; // 数值闪烁：红/绿背景 0.8s 渐隐
      if (el >= 0 && el < 800) {
        const a = (1 - el / 800) * 0.55;
        fillRoundRect(tx - 3, L.ly - 8, tw + 6, 16, 4,
          L.s.flashDir > 0 ? `rgba(255,60,60,${a})` : `rgba(0,181,120,${a})`);
      }
      ctx.fillStyle = L.s.color;
      ctx.fillText(text, tx, L.ly);
      ctx.restore();
      hitTargets.labels.push({ x: tx - 4, y: L.ly - 10, w: tw + 8, h: 20, bk: L.s.bk }); // 标签命中区
    }
  }

  /* --- 空状态 --- */
  if (!state.sectors.some(s => s.points.length)) {
    ctx.fillStyle = UI.txtFaint;
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(state.everFetched ? '暂无分时数据' : '正在获取数据…',
      g.W / 2, (g.plotT + g.plotB) / 2);
  }
}

/* ================= 板块资金排行榜 + 个股下钻 ================= */
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pctTxt = p => p == null ? '--' : (p > 0 ? '+' : '') + p.toFixed(2) + '%';
const clsOf = v => v == null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';

function stocksHtml(bk) {
  const c = state.stockCache[bk];
  if (SNAP && (!c || !c.stocks.length)) return '<div class="stocks"><div class="loading">离线快照未采集该板块个股</div></div>';
  if (!c || (c.loading && !c.stocks.length)) return '<div class="stocks"><div class="loading">加载个股数据…</div></div>';
  if (!c.stocks.length) {
    // 网络失败与真空数据区分开；失败后主循环每 8 秒自动重试
    return c.error
      ? '<div class="stocks"><div class="loading" data-retry="1" style="color:#ff7a7a;cursor:pointer">加载失败 · 8 秒后自动重试（点击立即重试）</div></div>'
      : '<div class="stocks"><div class="loading">暂无数据</div></div>';
  }
  const dir = state.expanded && state.expanded.tab === 'out' ? '净流出' : '净流入';
  let h = `<div class="stocks"><div class="st-title">个股主力${dir} TOP${c.stocks.length} · 分时资金走势</div>`;
  for (const s of c.stocks) {
    h += `<div class="srow">
      <canvas class="spark" data-code="${esc(s.code)}"></canvas>
      <span class="sinfo"><span class="sname">${esc(s.name)}</span><span class="scode">${esc(s.code)}</span></span>
      <span class="spct ${clsOf(s.pct)}">${pctTxt(s.pct)}</span>
      <span class="sval ${clsOf(s.val)}">${s.val == null ? '--' : fmtVal(s.val)}</span>
    </div>`;
  }
  return h + '</div>';
}

function renderRank() {
  const box = document.getElementById('rankList');
  if (!box) return;
  const cust = state.source === 'custom';
  const list = cust ? state.rankIn : (state.rankTab === 'in' ? state.rankIn : state.rankOut);
  if (!list.length) { box.innerHTML = `<div class="loading">${cust ? '自选为空 · 用上方搜索添加概念' : '加载中…'}</div>`; return; }
  const chartMap = new Map(state.sectors.map(s => [s.bk, s.color])); // 图中曲线标记
  let html = '';
  list.forEach((d, i) => {
    const val = typeof d.f62 === 'number' ? d.f62 / 1e8 : null;
    const dot = chartMap.has(d.f12) ? `<span class="rdot" style="background:${chartMap.get(d.f12)};color:${chartMap.get(d.f12)}"></span>` : '';
    const exp = state.expanded && state.expanded.bk === d.f12;
    const pct = typeof d.f3 === 'number' ? d.f3 : null;
    const pctHtml = cust && pct == null ? '' : `<span class="rpct ${clsOf(pct)}">${pctTxt(pct)}</span>`;
    const del = cust ? `<button class="cust-del" data-del="${esc(d.f12)}" title="移除自选">✕</button>` : '<span class="chev">▶</span>';
    html += `<div class="rrow${exp ? ' exp' : ''}" data-bk="${esc(d.f12)}">
      <span class="rk${!cust && i < 3 ? ' top3' : ''}">${i + 1}</span>
      <span class="rgrow"><span class="rname">${esc(d.f14 || d.f12)}</span>${dot}</span>
      ${pctHtml}
      <span class="rval ${clsOf(val)}">${val == null ? '--' : fmtVal(val)}</span>
      ${del}
    </div>`;
    if (exp) html += stocksHtml(d.f12);
  });
  box.innerHTML = html;
  drawAllSparks();
}

/* --- 个股分时资金迷你图 --- */
function drawSpark(cv, pts) {
  const dpr = window.devicePixelRatio || 1;
  const W = 56, H = 24;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c2 = cv.getContext('2d');
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.clearRect(0, 0, W, H);
  if (!pts || pts.length < 2) return;
  let mx = 0, mn = 0;
  for (const p of pts) { if (p.v > mx) mx = p.v; if (p.v < mn) mn = p.v; }
  if (mx === mn) { mx += 1; mn -= 1; }
  const x = i => 1 + (i / (pts.length - 1)) * (W - 2);
  const y = v => (H - 3) - ((v - mn) / (mx - mn)) * (H - 6);
  c2.strokeStyle = UI.zero2; c2.lineWidth = .5; // 0 轴基准线
  c2.beginPath(); c2.moveTo(0, y(0)); c2.lineTo(W, y(0)); c2.stroke();
  c2.strokeStyle = pts[pts.length - 1].v >= 0 ? '#ff5c5c' : '#00c48c'; // 红涨绿跌
  c2.lineWidth = 1.2; c2.lineJoin = 'round';
  c2.beginPath();
  pts.forEach((p, i) => i ? c2.lineTo(x(i), y(p.v)) : c2.moveTo(x(i), y(p.v)));
  c2.stroke();
}

/* --- 展开板块：拉成分股 + 个股分时（带在途守卫与自动重试） --- */
async function refreshExpanded() {
  const e = state.expanded;
  if (!e) return;
  if (SNAP) return; // 离线快照：个股只用已采集缓存
  const bk = e.bk, mySrc = state.source;
  let cache = state.stockCache[bk];
  if (!cache) cache = state.stockCache[bk] = { stocks: [], sparks: {}, loading: false, error: false, ts: 0 };
  if (cache.inFlight) return;           // 在途守卫：点击/定时器/主循环并发触发只跑一份
  cache.inFlight = true;
  cache.lastTry = Date.now();
  cache.error = false;                  // 新一轮尝试，清除错误标记
  if (!cache.stocks.length) { cache.loading = true; renderRank(); }
  const po = e.tab === 'in' ? 1 : 0;
  try {
    const res = await jsonpRetry(stockListUrl(bk, po), 4); // 成分股列表多给一次机会
    if (state.source !== mySrc || !state.expanded || state.expanded.bk !== bk) { cache.inFlight = false; return; }
    const diff = arr(res && res.data && res.data.diff);
    cache.stocks = diff.filter(d => d && d.f12).map(d => ({
      code: String(d.f12),
      mkt: d.f13 != null ? d.f13 : (String(d.f12).charAt(0) === '6' ? 1 : 0), // f13 缺失时按代码推断市场
      name: d.f14 || d.f12,
      pct: typeof d.f3 === 'number' ? d.f3 : null,
      val: typeof d.f62 === 'number' ? d.f62 / 1e8 : null,
    })).slice(0, 8);
    cache.ts = Date.now();
    cache.loading = false; // 修复：成功后复位加载标记，否则 stocksHtml 永远显示"加载中"
    renderRank();
    await Promise.all(cache.stocks.map(async (s, idx) => { // 并发拉个股分时（失败不影响整体）
      if (idx) await new Promise(r => setTimeout(r, idx * 250)); // 错峰发请求，降低并发触发限流
      try {
        const r = await jsonpRetry(stockKlineUrl(s.mkt, s.code));
        if (state.source !== mySrc) return;
        const klines = r && r.data && r.data.klines;
        const pts = [];
        for (const line of klines || []) {
          const ci = line.lastIndexOf(',');
          if (ci < 8) continue;
          const v = parseFloat(line.slice(ci + 1));
          if (!isFinite(v)) continue;
          const m = timeToMinute(line.slice(ci - 5, ci));
          if (m >= 0 && m <= TOTAL_MIN) pts.push({ m, v: v / 1e8 });
        }
        cache.sparks[s.code] = pts;
      } catch (err) { cache.sparks[s.code] = null; }
    }));
    if (state.expanded && state.expanded.bk === bk && state.source === mySrc) renderRank();
  } catch (err) {
    cache.loading = false;
    cache.error = true; // 标记网络失败（主循环每 8 秒自动重试，也可手动点击）
    if (state.expanded && state.expanded.bk === bk) renderRank();
  } finally {
    cache.inFlight = false;
  }
}

/* ================= 走势板块细分模块 ================= */
const $id = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const todayStr = () => { const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; };

// 近 N 分钟资金加速：Δ = 末值 − t(末值)−N 处的值（累计口径，交易分钟序号跨午休天然正确）
function accelOf(pts, N) {
  if (!pts || !pts.length) return null;
  const last = pts[pts.length - 1];
  const target = last.m - N;
  let base = pts[0]; // 开盘不足 N 分钟：首点兜底，防 NaN
  for (const p of pts) { if (p.m <= target) base = p; else break; }
  return last.v - base.v;
}

const BD = {
  gen: 0, mainBk: null,          // 当前细分主线
  subs: [],                      // [{bk,name,cnt,points,lastV,d13}]
  cache: {},                     // 主线BK -> {date, subs} 当日缓存（切回秒开）

/* --- 主图点击选中（标签命中区优先，其次曲线就近） --- */
let hitTargets = { labels: [], curves: [] };
function hitTestSector(x, y) {
  for (const h of hitTargets.labels)
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h.bk;
  let bestBk = null, bestD = 81; // 9px 容差（平方距离）
  for (const c of hitTargets.curves) {
    const p = c.pts;
    for (let i = 0; i < p.length; i += 2) {
      const dx = p[i] - x, dy = p[i + 1] - y;
      const d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; bestBk = c.bk; }
    }
  }
  return bestBk;
}

/* --- 概念白名单：分页拉全量（约 504 个），会话内只拉一次 --- */
async function ensureWhitelist() {
  if (BD.wl) return;
  if (!BD.wlPromise) BD.wlPromise = (async () => {
    const map = new Map();
    for (let pn = 1; pn <= 8; pn++) {
      const r = await jsonpRetry(wlUrl(pn));
      const d = r && r.data;
      const diff = arr(d && d.diff);
      if (!diff.length) break;
      for (const it of diff) if (it && it.f12) map.set(it.f12, it.f14 || it.f12);
      if (d && d.total && map.size >= d.total) break;
      await sleep(250);
    }
    if (map.size < 50) throw new Error('whitelist incomplete');
    BD.wl = map;
  })();
  await BD.wlPromise;
}

/* --- 细分识别主流程：白名单 → 成分股TOP30 → slist统计(≤4并发) → cnt≥3 TOP16 → 缓存 --- */
async function loadBreakdown(bk) {
  const gen = ++BD.gen;
  BD.mainBk = bk;
  BD.subs = []; BD.snapshots = []; BD.lastSnap = 0; BD.expanded = false;
  showBdSkeleton();
  // 离线快照：只用采集时访问过的主线（完整 subs），未访问的提示
  if (SNAP) {
    const v = (SNAP.bdVisited || {})[bk];
    if (v && v.length) {
      BD.subs = v.map(s => ({ ...s }));
      renderDual(); buildBdGrid(); renderAccel(); drawMiniSparks(); updateBdNote();
      return;
    }
    $id('bdAccIn').innerHTML = $id('bdAccOut').innerHTML = '<div class="bd-empty">—</div>';
    $id('bdGrid').innerHTML = '<div class="bd-empty">离线快照未采集该主线细分</div><div></div>';
    $id('bdCount').textContent = '0/0';
    renderDual();
    return;
  }
  try {
    await ensureWhitelist();
    if (BD.gen !== gen) return;
    let base = BD.cache[bk];
    if (!base || base.date !== todayStr()) {
      const selSec = state.sectors.find(s => s.bk === bk);
      const po = selSec && selSec.dir < 0 ? 0 : 1; // 流出主线取流出 TOP30 代表股
      const r = await jsonpRetry(`https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=30&np=1&fltt=2&invt=2&fid=f62&fs=b:${bk}+f:!50&fields=f12,f13,f14,f62&ut=${UT}&po=${po}`);
      if (BD.gen !== gen) return;
      const stocks = arr(r && r.data && r.data.diff).filter(d => d && d.f12)
        .map(d => ({ code: String(d.f12), mkt: d.f13 != null ? d.f13 : (String(d.f12).charAt(0) === '6' ? 1 : 0) }));
      const counts = new Map();
      let fails = 0;
      for (let i = 0; i < stocks.length; i += 4) { // ≤4 并发分批
        await Promise.all(stocks.slice(i, i + 4).map(async st => {
          try {
            const res = await jsonpRetry(slistUrl(st.mkt, st.code));
            for (const d of arr(res && res.data && res.data.diff)) {
              if (!d || !d.f12 || d.f12 === bk || !BD.wl.has(d.f12)) continue; // 白名单过滤 + 排除主线自身
              if (BROAD_STYLE.test(d.f14 || '')) continue; // 剔除宽基/风格板块（融资融券、MSCI、昨日涨停等）
              const c = counts.get(d.f12) || { bk: d.f12, name: d.f14 || d.f12, cnt: 0, f62: 0 };
              c.cnt++;
              if (typeof d.f62 === 'number') c.f62 = d.f62; // 概念当前主力净额（并列排序用）
              counts.set(d.f12, c);
            }
          } catch (e) { fails++; }
        }));
        await sleep(120);
        if (BD.gen !== gen) return;
      }
      if (stocks.length && fails > stocks.length / 3) throw new Error('slist too many fails'); // 允许 ≤1/3 失败
      base = { date: todayStr(), subs: [...counts.values()].filter(c => c.cnt >= 3)
        .sort((a, b) => b.cnt - a.cnt || Math.abs(b.f62) - Math.abs(a.f62)).slice(0, 16) };
      BD.cache[bk] = base;
    }
    if (!base.subs.length) {
      $id('bdAccIn').innerHTML = $id('bdAccOut').innerHTML = '<div class="bd-empty">—</div>';
      $id('bdGrid').innerHTML = '<div class="bd-empty">未识别到细分板块</div><div></div>';
      $id('bdCount').textContent = '0/0';
      return;
    }
    BD.subs = base.subs.map(s => ({ bk: s.bk, name: s.name, cnt: s.cnt, points: [],
      lastV: typeof s.f62 === 'number' ? s.f62 / 1e8 : null, d13: null,
      stOpen: false, stSort: 'speed', stocks: null, stTs: 0, stLoading: false, stError: false }));
    renderDual();
    buildBdGrid();
    refreshSubKlines(); // 细分分时（含加速值与迷你走势）
    refreshSubValues(); // 批量最新净额
    // 记录 visited（分时加载完成后再固化，供离线快照秒切）
    setTimeout(() => { if (BD.gen === gen) BD.visited[bk] = BD.subs.map(s => ({ ...s })); }, 3000);
  } catch (e) {
    if (BD.gen !== gen) return;
    $id('bdAccIn').innerHTML = $id('bdAccOut').innerHTML = '<div class="bd-empty">—</div>';
    $id('bdGrid').innerHTML = '<div class="bd-empty">细分加载失败 · <span style="color:var(--link);cursor:pointer" onclick="loadBreakdown(state.selected)">点击重试</span></div><div></div>';
    $id('bdCount').textContent = '…';
  }
}

/* --- 迷你走势：与主图同口径（红涨绿跌、0 轴细线、交易分钟横轴压缩午休）；截面兜底 --- */
function drawMiniSparks() {
  document.querySelectorAll('#bdGrid .bd-mcard').forEach(cardEl => {
    const sub = BD.subs.find(s => s.bk === cardEl.getAttribute('data-bk'));
    if (!sub) return;
    let pts = sub.points;
    if (!pts || pts.length < 2) { // kline 失败 → 盘中截面兜底
      const snap = BD.snapshots.filter(sn => sn.vals[sub.bk] != null)
        .map((sn, i) => ({ m: i, v: sn.vals[sub.bk] }));
      if (snap.length >= 2) pts = snap;
    }
    drawMiniSpark(cardEl.querySelector('.bd-spark'), pts);
  });
}
function drawMiniSpark(cv, pts) {
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 150, H = 64;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c2 = cv.getContext('2d');
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.clearRect(0, 0, W, H);
  if (!pts || pts.length < 2) return;
  let mx = -Infinity, mn = Infinity;
  for (const p of pts) { if (p.v > mx) mx = p.v; if (p.v < mn) mn = p.v; }
  if (mx === mn) { mx += 1; mn -= 1; }
  const pad = 3, t = pts[pts.length - 1].m - pts[0].m || 1;
  const x = m => pad + ((m - pts[0].m) / t) * (W - pad * 2);
  const y = v => pad + (1 - (v - mn) / (mx - mn)) * (H - pad * 2);
  if (mn < 0 && mx > 0) { // 0 轴细线
    c2.strokeStyle = UI.zero; c2.lineWidth = 1;
    c2.beginPath(); c2.moveTo(0, y(0)); c2.lineTo(W, y(0)); c2.stroke();
  }
  const last = pts[pts.length - 1];
  c2.strokeStyle = last.v >= 0 ? '#ff5c5c' : '#00c48c'; // 红涨绿跌
  c2.lineWidth = 1.5; c2.lineJoin = 'round';
  c2.beginPath();
  pts.forEach((p, i) => i ? c2.lineTo(x(p.m), y(p.v)) : c2.moveTo(x(p.m), y(p.v)));
  c2.stroke();
  c2.fillStyle = c2.strokeStyle; // 端点
  c2.beginPath(); c2.arc(x(last.m), y(last.v), 2.2, 0, Math.PI * 2); c2.fill();
}

/* --- 细分分时刷新（16 条 kline 错峰并发；单条失败保留旧曲线） --- */
async function refreshSubKlines() {
  if (!BD.subs.length || BD.klineBusy) return;
  BD.klineBusy = true;
  const gen = BD.gen;
  try {
    await Promise.all(BD.subs.map(async (sub, idx) => {
      if (idx) await sleep(idx * 120); // 错峰，降低并发限流
      try {
        const r = await jsonpRetry(klineUrl(sub.bk));
        if (BD.gen !== gen) return;
        sub.points = parsePts(r && r.data && r.data.klines);
        if (sub.points.length) {
          sub.lastV = sub.points[sub.points.length - 1].v;
          sub.d13 = accelOf(sub.points, 13);
        }
      } catch (e) { /* 保留旧曲线 */ }
    }));
    if (BD.gen !== gen) return;
    renderAccel(); updateCardVals(); drawMiniSparks();
    // 展开中的个股列表同步刷新（60s 缓存过期才重拉）
    for (const sub of BD.subs)
      if (sub.stOpen && (!sub.stocks || Date.now() - (sub.stTs || 0) > 60000)) fetchSubStocks(sub);
  } finally { BD.klineBusy = false; }
}

/* ================= 离线快照：收集 / 生成 / 恢复 ================= */
function collectSnapshot() {

  const scKeys = Object.keys(state.stockCache)
    .filter(k => state.stockCache[k] && state.stockCache[k].stocks.length)
    .slice(-3);
  const sc = {};
  for (const k of scKeys) {
    const c = state.stockCache[k];

function saveSnapshot() {
  if (SNAP) return; // 快照的快照无意义
  try {
    const json = JSON.stringify(collectSnapshot()).replace(/<\/script/gi, '<\\/script');
    const doc = document.documentElement.cloneNode(true);
    doc.querySelectorAll('script[src]').forEach(s => s.remove()); // 清残留 JSONP script
    // 动态容器还原为初始占位（快照打开时由 hydrate 重新渲染）
    const reset = { rankList: '<div class="loading">加载中…</div>', bdDual: '', bdAccIn: '',
      bdAccOut: '', bdGrid: '', clock: '--:--:--', pill: '加载中', upd: '离线快照', };

      const el = doc.querySelector('#' + id);
      if (el) el.innerHTML = html;
    }
    const snapBtn = doc.querySelector('#snapBtn');
    if (snapBtn) snapBtn.remove(); // 离线版无需再保存
    const holder = document.createElement('script');
    holder.textContent = 'window.__SNAPSHOT__=JSON.parse(' + JSON.stringify(json) + ');';
    const mainScript = doc.querySelector('body script'); // 主脚本（body 内第一个 script）
    doc.querySelector('body').insertBefore(holder, mainScript);
    const html = '<!DOCTYPE html>\n' + doc.outerHTML;
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));

}

/* ================= 全市场ETF资金净额模块 ================= */
// 全市场 ETF 主力净额（fs=四类场内基金，实测 total≈1584；pz 无论多大单页固定 100 条 → 必须翻页）
const etfScanUrl = pn => `https://push2.eastmoney.com/api/qt/clist/get?pn=${pn}&pz=100&np=1&fltt=2&invt=2&fid=f62&po=1&fs=b:MK0021,b:MK0022,b:MK0023,b:MK0024&fields=f12,f13,f14,f62&ut=${UT}`;
// ETF 分钟级资金 kline（与主图同接口，secid = 市场.代码）
const etfKlineUrl = (mkt, code) => `https://push2.eastmoney.com/api/qt/stock/fflow/kline/get?lmt=0&klt=1&secid=${mkt}.${code}&fields1=f1,f2,f3,f7&fields2=f51,f52&ut=${UT}`;

const ETF = {
  tab: 'ov',                                  // ov 总览 / td 走势 / rk 排行 / wa 观察
  map: new Map(),                             // code -> {name, mkt, f62(元|null)}
  scanTs: 0, scanning: false, scanErr: false,
  expected: null,                             // {date, n} 当日应有名单数（首次成功扫描的 total）
  lock: null,                                 // {date, lockTime, in:{code,name,lockVal,lastV}, out:{...}}
  watch: [], trend: [],                       // 关注 / 走势 code 列表（localStorage）
  hist: {},                                   // code -> [{t,v}] 30s×30 条滚动（锚点+关注，供5分钟变化）
  trendPts: {},                               // code -> 分钟分时（走势 Tab）
  rkTab: 'in', rkQuery: '', klineBusy: false,
};

/* --- localStorage（键按交易日失效的带 date 字段校验） --- */
function etfStore(k, v) { try { localStorage.setItem('etf_' + k, JSON.stringify(v)); } catch (e) {} }
function etfLoad(k, d) { try { const v = JSON.parse(localStorage.getItem('etf_' + k)); return v == null ? d : v; } catch (e) { return d; } }
function etfInitState() {
  const day = todayStr();
  ETF.expected = etfLoad('expected', null);
  if (!ETF.expected || ETF.expected.date !== day) ETF.expected = null;      // 跨日重置
  ETF.lock = etfLoad('lock', null);
  if (!ETF.lock || ETF.lock.date !== day) ETF.lock = null;                  // 跨日自动重锁
  ETF.watch = (etfLoad('watch', []) || []).filter(x => typeof x === 'string').slice(0, 30);
  ETF.trend = (etfLoad('trend', []) || []).filter(x => typeof x === 'string').slice(0, 6);
}
const etfDateTxt = () => todayStr().replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3');

/* --- 全量扫描：翻页拉全（≤4 并发分批），单页重试后仍失败放弃该页 --- */
async function etfScan(manual) {
  if (SNAP || ETF.scanning) return;
  ETF.scanning = true;
  const btn = $id('etfRefresh');
  if (manual && btn) btn.textContent = '扫描中…';
  try {
    const r1 = await jsonpRetry(etfScanUrl(1));
    const d1 = r1 && r1.data;
    const total = (d1 && d1.total) || 0;
    const pages = Math.max(1, Math.ceil(total / 100));
    const results = [d1];
    for (let pn = 2; pn <= pages; pn += 4) {          // ≤4 并发分批拉余下页
      const batch = [];
      for (let p = pn; p < Math.min(pn + 4, pages + 1); p++) batch.push(p);
      await Promise.all(batch.map(async p => {
        try { const r = await jsonpRetry(etfScanUrl(p)); results[p - 1] = r && r.data; }
        catch (e) { /* 该页放弃，按成功部分统计 */ }
      }));
    }
    const map = new Map();
    for (const d of results) for (const it of arr(d && d.diff)) {
      if (!it || it.f12 == null) continue;
      map.set(String(it.f12), { name: it.f14 || String(it.f12),
        mkt: it.f13 != null ? it.f13 : (String(it.f12).charAt(0) === '5' ? 1 : 0),
        f62: typeof it.f62 === 'number' ? it.f62 : null });
    }
    if (!map.size) throw new Error('empty scan');
    ETF.map = map; ETF.scanTs = Date.now(); ETF.scanErr = false;
    if (total && (!ETF.expected || ETF.expected.date !== todayStr())) {
      ETF.expected = { date: todayStr(), n: total };
      etfStore('expected', ETF.expected);
    }
    if (!ETF.lock && ETF.expected && map.size >= ETF.expected.n) etfLockNow(); // 首次完整快照锁定
    etfPushHist();
    etfRender();
  } catch (e) {
    ETF.scanErr = true;
    etfRender();
  } finally {
    ETF.scanning = false;
    if (btn) btn.textContent = '刷新';
  }
}

/* --- 锚点锁定 / 重新锁定 --- */
function etfLockNow() {
  const list = [...ETF.map.entries()].filter(([, v]) => typeof v.f62 === 'number');
  if (!list.length) return;
  list.sort((a, b) => b[1].f62 - a[1].f62);
  const mk = e => ({ code: e[0], name: e[1].name, lockVal: e[1].f62 / 1e8, lastV: e[1].f62 / 1e8 });
  ETF.lock = { date: todayStr(), lockTime: Date.now(), in: mk(list[0]), out: mk(list[list.length - 1]) };
  etfStore('lock', ETF.lock);
  ETF.hist = {}; // 重新锁定：历史清空，5分钟变化重新积累
}

/* --- 历史推进（锚点 + 关注，30s 一格滚动 30 条） --- */
function etfPushHist() {
  const codes = new Set([
    ...(ETF.lock ? [ETF.lock.in.code, ETF.lock.out.code] : []),
    ...ETF.watch,
  ]);
  const now = Date.now();
  for (const c of codes) {
    const v = ETF.map.get(c);
    if (!v || typeof v.f62 !== 'number') continue;
    (ETF.hist[c] = ETF.hist[c] || []).push({ t: now, v: v.f62 / 1e8 });
    if (ETF.hist[c].length > 30) ETF.hist[c].shift();
  }
  if (ETF.lock) { // 锚点 lastV 持久化（停牌时显示最后有效值）
    for (const k of ['in', 'out']) {
      const v = ETF.map.get(ETF.lock[k].code);
      if (v && typeof v.f62 === 'number') ETF.lock[k].lastV = v.f62 / 1e8;
    }
    etfStore('lock', ETF.lock);
  }
}

/* --- 5 分钟变化 = 当前 − 5 分钟前快照值（历史不足 5 分钟显示暂无） --- */
function etfDelta5(code) {
  const cur = ETF.map.get(code);
  const h = ETF.hist[code];
  if (!cur || typeof cur.f62 !== 'number' || !h || !h.length) return null;
  const now = ETF.scanTs || Date.now();
  if (now - h[0].t < 300000) return null;
  const target = now - 300000;
  let best = h[0];
  for (const p of h) if (Math.abs(p.t - target) < Math.abs(best.t - target)) best = p;
  return cur.f62 / 1e8 - best.v;
}

/* --- 六指标统计 --- */
function etfStats() {
  const s = { got: ETF.map.size, exp: ETF.expected ? ETF.expected.n : 0,
    in: 0, out: 0, sum: 0, maxIn: null, maxOut: null, top5In: null, top5Out: null };
  const pos = [], neg = [];
  for (const [code, v] of ETF.map) {
    if (typeof v.f62 !== 'number') continue; // f62=0/缺失：计入返回数，不参与统计
    const yi = v.f62 / 1e8;
    s.sum += yi;
    if (yi > 0) { s.in++; pos.push({ code, name: v.name, v: yi }); }
    else if (yi < 0) { s.out++; neg.push({ code, name: v.name, v: yi }); }
  }
  pos.sort((a, b) => b.v - a.v); neg.sort((a, b) => a.v - b.v);
  if (pos.length) {
    s.maxIn = pos[0];
    const tot = pos.reduce((x, y) => x + y.v, 0);
    if (tot > 0) s.top5In = pos.slice(0, 5).reduce((x, y) => x + y.v, 0) / tot;
  }
  if (neg.length) {
    s.maxOut = neg[0];
    const tot = Math.abs(neg.reduce((x, y) => x + y.v, 0));
    if (tot > 0) s.top5Out = Math.abs(neg.slice(0, 5).reduce((x, y) => x + y.v, 0)) / tot;
  }
  return s;
}

function etfCell(name, val, note) {

  const maxOut = s.maxOut ? `<span class="down">${esc(s.maxOut.name)}</span>` : '--';

  let html = `
    <div class="etf-sec-h"><span class="etf-sec-t">ETF资金决策摘要</span>

    <div class="etf-mgrid">
      ${etfCell('全量覆盖', cov, ETF.scanErr ? '扫描失败，等待自愈' : (s.exp && s.got < s.exp ? `缺失 ${s.exp - s.got} 只` : '名单全量校验通过'))}
      ${etfCell('资金广度', breadth, ratio == null ? '--' : `流入占比 ${ratio}%`)}
      ${etfCell('主力净额合计', `<span class="${clsOf(s.sum)}">${fmtVal(s.sum)}</span>`, '二级市场大单口径')}
      ${etfCell('最强流入', maxIn, s.maxIn ? `<span class="up">${fmtVal(s.maxIn.v)}</span>` : '--')}
      ${etfCell('最强流出', maxOut, s.maxOut ? `<span class="down">${fmtVal(s.maxOut.v)}</span>` : '--')}
      ${etfCell('Top5集中度', `${pct(s.top5In)} <span class="u">/</span> ${pct(s.top5Out)}`, '流入 / 流出')}
    </div>
    <div class="etf-sec-h"><span class="etf-sec-t">当日强弱锚点</span>
      <button class="etf-btn" data-etfrelock="1">重新锁定</button></div>
    <div class="etf-sub">${ETF.lock
      ? `本机首次完整快照 ${hhmmss(new Date(ETF.lock.lockTime))} 锁定名称，数值继续实时更新`
      : '等待当日首次完整快照后自动锁定最强流入/流出'}</div>`;
  html += etfAnchorHtml('in') + etfAnchorHtml('out');
  $id('etfBody').innerHTML = html;
}
function etfAnchorHtml(k) {
  const a = ETF.lock && ETF.lock[k];
  if (!a) return `<div class="etf-anc"><div class="etf-empty" style="padding:10px 0">${ETF.scanErr ? '扫描失败 · 点击右上「刷新」重试' : '等待锁定…'}</div></div>`;
  const cur = ETF.map.get(a.code);
  const has = cur && typeof cur.f62 === 'number';
  const curV = has ? cur.f62 / 1e8 : (a.lastV != null ? a.lastV : a.lockVal);
  const rel = curV - a.lockVal;
  const d5 = etfDelta5(a.code);
  const inTrend = ETF.trend.includes(a.code);
  const watched = ETF.watch.includes(a.code);
  return `<div class="etf-anc">
    <div class="etf-anc-l">
      <div class="etf-anc-tag">${k === 'in' ? '强流入锚点' : '强流出锚点'}${has ? '' : ' · 数据缺失'}</div>
      <div class="etf-anc-name">${esc(a.name)}</div>
      <div class="etf-anc-code">${esc(a.code)}</div>
    </div>
    <div class="etf-anc-r">
      <div class="etf-anc-val ${clsOf(curV)}">${fmtVal(curV)}</div>
      <div class="etf-anc-lock">锁定 ${fmtVal(a.lockVal)} · 相对锁定 <span class="${clsOf(rel)}">${fmtVal(rel)}</span> · 5分钟 ${d5 == null ? '暂无' : `<span class="${clsOf(d5)}">${fmtVal(d5)}</span>`}</div>
      <div class="etf-anc-btns">
        <button class="etf-btn${inTrend ? ' on' : ''}" data-etftrend="${esc(a.code)}">${inTrend ? '移出走势' : '加入走势'}</button>
        <button class="etf-btn${watched ? ' on' : ''}" data-etfwatch="${esc(a.code)}">${watched ? '已关注' : '关注'}</button>
      </div>
    </div>
  </div>`;
}

/* --- 走势 Tab：复用主图口径（红涨绿跌、0轴、午休压缩、端点标签防重叠） --- */
function etfRenderTd() {
  const chips = ETF.trend.map(code => {
    const info = ETF.map.get(code);
    const pts = ETF.trendPts[code] || [];
    const v = pts.length ? pts[pts.length - 1].v : null;
    return `<span class="etf-chip">${esc(info ? info.name : code)} <span class="${clsOf(v)}">${v == null ? '--' : fmtVal(v)}</span><span class="x" data-etftrend="${esc(code)}">✕</span></span>`;
  }).join('');
  $id('etfBody').innerHTML = `
    <div class="etf-sec-h"><span class="etf-sec-t">ETF分钟资金走势</span>
      <span class="etf-sec-note">10 秒刷新 · 最多 6 条</span></div>
    ${ETF.trend.length ? '<canvas id="etfCv" class="etf-cv"></canvas><div class="etf-chips">' + chips + '</div>'
      : '<div class="etf-empty">在总览锚点或排行里点「加入走势」</div>'}`;
  etfDraw();
}
function etfDraw() {
  const cv = $id('etfCv');
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = 240;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const c2 = cv.getContext('2d');
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.clearRect(0, 0, W, H);
  const plotL = 40, plotR = W - 10, plotT = 12, plotB = H - 20;
  const zeroY = plotT + (plotB - plotT) * 0.35;      // 双段刻度与主图一致
  let vMax = 0.1, vMin = -0.1;
  const series = ETF.trend.map(code => ({ code, pts: ETF.trendPts[code] || [] }));
  for (const { pts } of series) for (const p of pts) {
    if (p.v > vMax) vMax = p.v;
    if (p.v < vMin) vMin = p.v;
  }
  const sc = { vMax, vMin };
  const X = m => plotL + (m / TOTAL_MIN) * (plotR - plotL);
  const Y = v => Math.max(plotT, Math.min(plotB, v >= 0
    ? zeroY - (v / sc.vMax) * (plotB - plotT) * 0.35
    : zeroY + (-v / -sc.vMin) * (plotB - plotT) * 0.65));
  // Y 网格
  c2.font = '10px system-ui, sans-serif';
  c2.textAlign = 'right'; c2.textBaseline = 'middle';
  const hLine = (v, strong) => {
    const y = Y(v);
    c2.strokeStyle = strong ? UI.axisStrong : UI.gridW;
    c2.lineWidth = strong ? 1.5 : 1;
    c2.beginPath(); c2.moveTo(plotL, y); c2.lineTo(plotR, y); c2.stroke();
    c2.fillStyle = UI.txtFaint;
    c2.fillText((v > 0 ? '+' : '') + fmtTick(v), plotL - 6, y);
  };
  const ps = niceStep(sc.vMax / 2);
  for (let i = 1; i * ps <= sc.vMax * 1.0001; i++) hLine(i * ps, false);
  const ns = niceStep(-sc.vMin / 3);
  for (let i = 1; i * ns <= -sc.vMin * 1.0001; i++) hLine(-i * ns, false);
  hLine(0, true);
  // 午休虚线 + X 轴
  c2.save();
  c2.setLineDash([4, 4]);
  c2.strokeStyle = UI.lunch;
  c2.beginPath(); c2.moveTo(X(120), plotT); c2.lineTo(X(120), plotB); c2.stroke();
  c2.restore();
  c2.fillStyle = UI.txtDim; c2.textBaseline = 'top';
  c2.textAlign = 'left'; c2.fillText('09:30', plotL, plotB + 5);
  c2.textAlign = 'center'; c2.fillText('11:30/13:00', X(120), plotB + 5);
  c2.textAlign = 'right'; c2.fillText('15:00', plotR, plotB + 5);
  // 曲线（红涨绿跌配色，色系内区分）
  const labels = [];
  series.forEach(({ code, pts }, i) => {
    if (!pts.length) return;
    const info = ETF.map.get(code);
    const lastV = pts[pts.length - 1].v;
    const color = lastV >= 0 ? REDS[i % 5] : GREENS[i % 5];
    c2.strokeStyle = color; c2.lineWidth = 1.8;
    c2.lineJoin = 'round'; c2.lineCap = 'round';
    c2.beginPath();
    pts.forEach((p, j) => j ? c2.lineTo(X(p.m), Y(p.v)) : c2.moveTo(X(p.m), Y(p.v)));
    c2.stroke();
    labels.push({ name: info ? info.name : code, v: lastV, color,
      ex: X(pts[pts.length - 1].m), ey: Y(lastV) });
  });
  // 端点标签（推开防重叠，简化自主图）
  c2.font = '11px system-ui, sans-serif';
  c2.textBaseline = 'middle'; c2.textAlign = 'left';
  labels.sort((a, b) => a.ey - b.ey);
  const gap = 15;
  labels.forEach(L => L.ly = L.ey);
  for (let i = 1; i < labels.length; i++)
    if (labels[i].ly < labels[i - 1].ly + gap) labels[i].ly = labels[i - 1].ly + gap;
  if (labels.length && labels[labels.length - 1].ly > plotB - 2) {
    labels[labels.length - 1].ly = plotB - 2;
    for (let i = labels.length - 2; i >= 0; i--)
      if (labels[i].ly > labels[i + 1].ly - gap) labels[i].ly = labels[i + 1].ly - gap;
  }
  for (const L of labels) {
    const text = L.name + ' ' + fmtVal(L.v);
    const tw = c2.measureText(text).width;
    const tx = Math.min(L.ex + 8, W - tw - 4);
    if (Math.abs(L.ly - L.ey) > 6) { // 引导线
      c2.strokeStyle = L.color; c2.globalAlpha = .5; c2.lineWidth = .8;
      c2.beginPath(); c2.moveTo(L.ex + 3, L.ey); c2.lineTo(tx - 2, L.ly); c2.stroke();
      c2.globalAlpha = 1;
    }
    c2.fillStyle = L.color;
    c2.beginPath(); c2.arc(L.ex, L.ey, 2.8, 0, Math.PI * 2); c2.fill();
    c2.fillStyle = UI.labelBg;
    c2.fillRect(tx - 3, L.ly - 8, tw + 6, 16);
    c2.fillStyle = L.color;
    c2.fillText(text, tx, L.ly);
  }
  if (!series.some(s => s.pts.length)) {
    c2.fillStyle = UI.txtFaint;
    c2.font = '13px system-ui, sans-serif';
    c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillText('加载走势数据…', W / 2, (plotT + plotB) / 2);
  }
}
async function etfFetchKlines() {
  if (!ETF.trend.length || ETF.klineBusy || SNAP) return;
  ETF.klineBusy = true;
  try {
    await Promise.all(ETF.trend.map(async (code, idx) => {
      if (idx) await sleep(idx * 150); // 错峰
      try {
        const info = ETF.map.get(code);
        const mkt = info ? info.mkt : (code.charAt(0) === '5' || code.charAt(0) === '6' ? 1 : 0);
        const r = await jsonpRetry(etfKlineUrl(mkt, code));
        const pts = parsePts(r && r.data && r.data.klines);
        if (pts.length) ETF.trendPts[code] = pts;   // 失败保留旧曲线
      } catch (e) { /* 保留旧曲线 */ }
    }));
    if (ETF.tab === 'td') etfDraw();
    else if (ETF.trend.length) { // 非当前 Tab 也预渲染一次（切换即时显示）
      if ($id('etfCv')) etfDraw();
    }
  } finally { ETF.klineBusy = false; }
}

/* --- 排行 Tab：TOP200 + 搜索 --- */
function etfRenderRk() {
  $id('etfBody').innerHTML = `
    <div class="etf-sec-h" style="margin-top:8px">
      <span class="etf-seg">
        <button class="etf-tab${ETF.rkTab === 'in' ? ' on' : ''}" data-etfrk="in">净流入降序</button>
        <button class="etf-tab${ETF.rkTab === 'out' ? ' on' : ''}" data-etfrk="out">净流出升序</button>
      </span>
      <input class="etf-search" id="etfRkQ" placeholder="搜索名称 / 代码（全量 ${ETF.map.size} 只）" value="${esc(ETF.rkQuery)}" autocomplete="off">
    </div>
    <div class="etf-list" id="etfRkList"></div>`;
  etfRkListRender();
}
function etfRkListRender() {
  const box = $id('etfRkList');
  if (!box) return;
  if (!ETF.map.size) { box.innerHTML = `<div class="etf-empty">${ETF.scanErr ? '扫描失败 · 点击右上「刷新」重试' : '扫描中…'}</div>`; return; }
  let list = [...ETF.map.entries()].map(([code, v]) => ({ code, ...v, yi: typeof v.f62 === 'number' ? v.f62 / 1e8 : null }));
  const q = ETF.rkQuery.trim().toLowerCase();
  if (q) list = list.filter(x => x.name.toLowerCase().includes(q) || x.code.toLowerCase().includes(q));
  list.sort((a, b) => (b.yi || 0) - (a.yi || 0));
  if (ETF.rkTab === 'out') { list = list.filter(x => x.yi != null && x.yi < 0); list.reverse(); }
  else list = list.filter(x => x.yi != null && x.yi >= 0 || x.yi == null);
  box.innerHTML = list.slice(0, 200).map((x, i) => etfRowHtml(x, i, false)).join('')
    || '<div class="etf-empty">无匹配结果</div>';
}
function etfRowHtml(x, i, withD5) {
  const inTrend = ETF.trend.includes(x.code);
  const watched = ETF.watch.includes(x.code);
  const d5 = withD5 ? etfDelta5(x.code) : null;
  return `<div class="etf-row">
    <span class="rk${i < 3 ? ' top3' : ''}">${i + 1}</span>
    <span class="etf-name"><b>${esc(x.name)}</b><i>${esc(x.code)}</i></span>
    ${withD5 ? `<span class="etf-d5">${d5 == null ? '暂无' : `<span class="${clsOf(d5)}">${fmtVal(d5)}</span>`}</span>` : ''}
    <span class="etf-val ${clsOf(x.yi)}">${x.yi == null ? '--' : fmtVal(x.yi)}</span>
    <button class="etf-btn${inTrend ? ' on' : ''}" data-etftrend="${esc(x.code)}">${inTrend ? '移出' : '+走势'}</button>
    <button class="etf-btn${watched ? ' on' : ''}" data-etfwatch="${esc(x.code)}">${watched ? '已关注' : '关注'}</button>
    ${withD5 ? `<button class="etf-btn" data-etfremove="${esc(x.code)}">移除</button>` : ''}
  </div>`;
}

/* --- 观察 Tab --- */
function etfRenderWa() {
  if (!ETF.watch.length) {
    $id('etfBody').innerHTML = '<div class="etf-empty">观察列表为空 · 在排行或锚点里点「关注」加入</div>';
    return;
  }
  const rows = ETF.watch.map((code, i) => {
    const v = ETF.map.get(code);
    if (!v) return `<div class="etf-row"><span class="rk">${i + 1}</span>
      <span class="etf-name"><b class="stale">${esc(code)}</b><i>已退市/失效</i></span>
      <span class="etf-val flat">--</span><span style="flex:1"></span>
      <button class="etf-btn" data-etfremove="${esc(code)}">移除</button></div>`;
    return etfRowHtml({ code, name: v.name, yi: typeof v.f62 === 'number' ? v.f62 / 1e8 : null }, i, true);
  }).join('');
  $id('etfBody').innerHTML = `
    <div class="etf-sec-h" style="margin-top:8px"><span class="etf-sec-t">关注列表（${ETF.watch.length}）</span>
      <span class="etf-sec-note">${ETF.scanTs ? '快照 ' + hhmmss(new Date(ETF.scanTs)) : ''}</span></div>
    <div class="etf-list">${rows}</div>`;
}

/* --- 渲染分发 / Tab 切换 --- */
function etfRender() {
  const body = $id('etfBody');
  if (!body) return;
  try {
    if (SNAP) { body.innerHTML = '<div class="etf-empty">离线快照未采集 ETF 数据</div>'; return; }
    // 头部状态
    const badge = $id('etfBadge');
    if (badge) {
      if (ETF.scanErr) { badge.textContent = '扫描失败'; badge.className = 'etf-badge miss'; }
      else if (!ETF.map.size) { badge.textContent = '扫描中…'; badge.className = 'etf-badge ok'; }
      else if (ETF.expected && ETF.map.size < ETF.expected.n) { badge.textContent = `缺失 ${ETF.expected.n - ETF.map.size} 只`; badge.className = 'etf-badge miss'; }
      else { badge.textContent = '名单全量校验通过'; badge.className = 'etf-badge ok'; }
    }
    const de = $id('etfDate');
    if (de) de.textContent = etfDateTxt();
    ({ ov: etfRenderOv, td: etfRenderTd, rk: etfRenderRk, wa: etfRenderWa }[ETF.tab] || etfRenderOv)();
  } catch (e) { /* ETF 模块异常不外溢 */ }
}
function etfSetTab(t) {
  ETF.tab = t;
  [['etfTabOv', 'ov'], ['etfTabTd', 'td'], ['etfTabRk', 'rk'], ['etfTabWa', 'wa']]
    .forEach(([id, k]) => $id(id).classList.toggle('on', k === t));
  etfRender();
}
$id('etfTabOv').addEventListener('click', () => etfSetTab('ov'));
$id('etfTabTd').addEventListener('click', () => etfSetTab('td'));
$id('etfTabRk').addEventListener('click', () => etfSetTab('rk'));
$id('etfTabWa').addEventListener('click', () => etfSetTab('wa'));
$id('etfRefresh').addEventListener('click', () => etfScan(true));

/* --- 交互（body 内动态元素，事件委托） --- */
function etfToggleTrend(code) {
  const i = ETF.trend.indexOf(code);
  if (i >= 0) ETF.trend.splice(i, 1);
  else {
    if (ETF.trend.length >= 6) return etfToast('走势最多 6 条，请先移出一条');
    ETF.trend.push(code);
  }
  etfStore('trend', ETF.trend);
  etfRender();
  if (ETF.trend.includes(code)) etfFetchKlines();
}
function etfToggleWatch(code) {
  const i = ETF.watch.indexOf(code);
  if (i >= 0) ETF.watch.splice(i, 1); else ETF.watch.push(code);
  etfStore('watch', ETF.watch);
  etfRender();
}
$id('etfBody').addEventListener('click', ev => {
  const el = ev.target.closest('[data-etftrend],[data-etfwatch],[data-etfremove],[data-etfrelock],[data-etfrk]');
  if (!el) return;
  if (el.hasAttribute('data-etftrend')) etfToggleTrend(el.getAttribute('data-etftrend'));
  else if (el.hasAttribute('data-etfwatch')) etfToggleWatch(el.getAttribute('data-etfwatch'));
  else if (el.hasAttribute('data-etfremove')) {
    ETF.watch = ETF.watch.filter(c => c !== el.getAttribute('data-etfremove'));
    etfStore('watch', ETF.watch);
    etfRender();
  } else if (el.hasAttribute('data-etfrelock')) {
    if (ETF.map.size) { etfLockNow(); etfRender(); }
    else etfToast('暂无数据，无法锁定');
  } else if (el.hasAttribute('data-etfrk')) {
    ETF.rkTab = el.getAttribute('data-etfrk');
    etfRenderRk();
  }
});
$id('etfBody').addEventListener('input', ev => {
  if (ev.target.id === 'etfRkQ') { ETF.rkQuery = ev.target.value; etfRkListRender(); }
});

/* --- toast --- */
let etfToastTimer = 0;
function etfToast(msg) {
  let el = document.getElementById('etfToast');
  if (!el) { el = document.createElement('div'); el.id = 'etfToast'; el.className = 'etf-toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('on');
  clearTimeout(etfToastTimer);
  etfToastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

/* ================= 主循环（时钟 + 跳动指示 + 重绘） ================= */
let lastSec = -1;
function loop() {
  const now = new Date();
  if (now.getSeconds() !== lastSec) {
    lastSec = now.getSeconds();
    clockEl.textContent = hhmmss(now);
    tickTheme(); // auto 模式到点自动切换浅/深色
    state.phase = getPhase(now);
    if (SNAP) { // 离线快照：固定标记 + 采集时间，不做任何网络动作
      pillEl.textContent = '离线快照 ' + hhmmss(new Date(SNAP.ts));
      pillEl.className = 'pill off';
      dotEl.className = 'dot idle';
    } else {
      const [txt, cls] = PHASE_INFO[state.phase];
      pillEl.textContent = txt;
      pillEl.className = 'pill ' + cls;
      dotEl.className = 'dot' + (state.phase === 'trading' ? '' : ' idle');
    }
    // 展开的板块若有个股加载失败（或迷你图缺失），每 8 秒自动重试直到成功
    if (!SNAP && state.expanded) {
      const c = state.stockCache[state.expanded.bk];
      if (c && !c.inFlight) {
        const broken = c.error || (c.stocks.length > 0 && c.stocks.some(s => c.sparks[s.code] == null));
        if (broken && Date.now() - (c.lastTry || 0) > 8000) refreshExpanded();
      }
    }
    // 盘中截面：每 60s 落一版 16 个细分当前值（滚动 30 个；计数展示 + 迷你图兜底）
    if (!SNAP && BD.subs.length && BD.subs.some(s => s.lastV != null) && Date.now() - BD.lastSnap >= 60000) {
      const vals = {};
      for (const s of BD.subs) if (s.lastV != null) vals[s.bk] = s.lastV;
      BD.snapshots.push({ t: Date.now(), vals });
      if (BD.snapshots.length > 30) BD.snapshots.shift();
      BD.lastSnap = Date.now();
      updateBdNote();
    }
  }
  drawChart();
  requestAnimationFrame(loop);
}

/* ================= 刷新调度：10 秒一轮，非交易时段不发请求 ================= */
const FETCHABLE = ['auction', 'trading'];
if (!SNAP) {
  // 自调度刷新：正常 10 秒；连续失败 ≥3 次退避到 30 秒（限流友好）
  (function scheduleFetch() {
    setTimeout(async () => {
      if (FETCHABLE.includes(state.phase) || !state.everFetched) await fetchCycle();
      scheduleFetch();
    }, failStreak >= 3 ? 30000 : 10000);
  })();
  fetchCycle(true); // 首次加载（收盘后即作为当日快照）
  showBdSkeleton(); // 细分模块初始骨架屏（待默认选中后加载）
  document.getElementById('snapBtn').addEventListener('click', saveSnapshot);
  // ETF 模块：首轮扫描 + 30s 全量自愈 + 10s 走势 kline
  etfInitState();
  etfRender();
  etfScan();
  setInterval(() => {
    if (FETCHABLE.includes(state.phase) || !ETF.scanTs) etfScan();
  }, 30000);
  etfFetchKlines();
  setInterval(() => {
    if (ETF.trend.length && (FETCHABLE.includes(state.phase) || !Object.keys(ETF.trendPts).length)) etfFetchKlines();
  }, 10000);
} else {
  hydrateSnapshot(); // 离线快照：直接恢复数据，零网络请求
  etfInitState();
  etfRender(); // SNAP 守卫：显示"离线快照未采集 ETF 数据"
}

/* ================= 自适应 ================= */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  CV.width = Math.round(CV.clientWidth * dpr);
  CV.height = Math.round(CV.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
